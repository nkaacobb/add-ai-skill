interface:
  display_name: "AI Enablement"
  short_description: "Install, upgrade and extend an app's AI: the screen-aware agent drawer, tools and toolsets, Agent Skills, agents and permissions (any LLM)"
  default_prompt: "Use $ai-enablement on this application: detect what of its AI layer is already there; install the agent drawer if there is none, upgrade it if it is older, otherwise validate it — then add what I ask for (a tool, a toolset, a skill, an agent), keeping the app's own customisations."
policy:
  allow_implicit_invocation: true
